<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Courier App Icon
       Bauhaus/Mondrian: bold geometric envelope with send arrow.
       Red ground for visibility on light and dark OS chrome.
       Palette: #E1000F red, #000000 black, #F5F0EB warm white, #FFD700 yellow. -->

  <!-- Red ground -->
  <rect width="512" height="512" fill="#E1000F"/>

  <!-- Black structural frame -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#000000" stroke-width="16"/>

  <!-- Yellow bottom-right accent block -->
  <rect x="362" y="392" width="150" height="120" fill="#FFD700"/>
  <rect x="362" y="392" width="150" height="120" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Main envelope body: warm white rectangle -->
  <rect x="56" y="120" width="400" height="280" fill="#F5F0EB"/>
  <rect x="56" y="120" width="400" height="280" fill="none" stroke="#000000" stroke-width="6"/>

  <!-- Envelope flap: red V shape -->
  <polygon points="62,126 256,276 450,126" fill="#E1000F"/>
  <line x1="62" y1="126" x2="256" y2="276" stroke="#000000" stroke-width="5"/>
  <line x1="256" y1="276" x2="450" y2="126" stroke="#000000" stroke-width="5"/>

  <!-- Envelope bottom V (shadow/depth) -->
  <polygon points="62,394 256,280 450,394" fill="#E1000F" opacity="0.2"/>

  <!-- Central send arrow: black diamond with white arrow -->
  <polygon points="256,196 332,268 256,340 180,268" fill="#000000"/>
  <polygon points="236,250 282,268 236,286" fill="#F5F0EB"/>

  <!-- Black accent bar top-left corner -->
  <rect x="8" y="8" width="140" height="8" fill="#000000"/>
  <rect x="8" y="8" width="8" height="100" fill="#000000"/>
</svg>
