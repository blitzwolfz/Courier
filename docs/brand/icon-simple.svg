<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Courier Simplified Icon (for small sizes: favicon, 32px, taskbar)
       Maximum contrast, minimal detail. -->

  <!-- Black ground -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Red accent corner -->
  <rect x="0" y="0" width="180" height="120" fill="#E1000F"/>

  <!-- White envelope body -->
  <rect x="56" y="116" width="400" height="284" fill="#F5F0EB"/>

  <!-- Red envelope flap -->
  <polygon points="56,116 256,272 456,116" fill="#E1000F"/>

  <!-- Black arrow diamond -->
  <polygon points="256,200 324,264 256,328 188,264" fill="#000000"/>

  <!-- White send arrow -->
  <polygon points="240,248 280,264 240,280" fill="#FFFFFF"/>

  <!-- Yellow accent -->
  <rect x="366" y="400" width="146" height="112" fill="#FFD700"/>
</svg>
